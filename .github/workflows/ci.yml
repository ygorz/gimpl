# GIMPL governed CI pipeline (Module 4.2). Design and classification of
# every job: docs/ci-step-design.md. eval/test_policy.py checks this file
# against that design on every run, and pipeline-integrity checks the
# file's own guardrails in a job that depends on no other job.
#
# No paths: filter on the triggers. The workflow runs on every pull request
# and every push to master; change-type-check decides inside the run which
# heavy work is needed, so the required gates always report a result.
name: CI

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

jobs:
  # informational: lists the changed files and sets the flags later jobs read
  change-type-check:
    name: Change Classifier
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 2
    outputs:
      changed-files: ${{ steps.classify.outputs.changed-files }}
      requires-eval: ${{ steps.classify.outputs.requires-eval }}
      touches-policy: ${{ steps.classify.outputs.touches-policy }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Classify changed files
        id: classify
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          # Paths that change what an agent can do, how it is checked, or the
          # image it runs in: agent and skill definitions, settings and hooks,
          # the MCP servers and allow-lists, the eval harness, the container
          # launcher, the policy and grant map, CLAUDE.md and the image itself.
          REQUIRES_EVAL_RE='^(\.claude/agents/|\.claude/skills/|\.claude/settings\.json|\.mcp\.json|mcp/|eval/|scripts/hooks/|scripts/run-agent\.sh|scripts/run-eval-gate\.py|docs/governance-policy\.md|docs/routing-and-tool-grant-map\.md|CLAUDE\.md|Dockerfile|docker-entrypoint\.sh|requirements-(ci|mcp)\.txt)'
          # Paths that grant or limit access, or change the checks that guard it.
          TOUCHES_POLICY_RE='^(docs/governance-policy\.md|mcp/.*allow-?list\.json|scripts/run-agent\.sh|scripts/hooks/|\.claude/agents/|\.claude/skills/|\.claude/settings\.json|eval/test_policy\.py|scripts/check-pipeline-integrity\.py|\.github/workflows/)'

          if [ "$EVENT_NAME" = "pull_request" ]; then
            BASE="$PR_BASE_SHA"
          else
            BASE="$PUSH_BEFORE_SHA"
          fi

          DIFF_OK=true
          if [ -z "$BASE" ] || [ "$BASE" = "0000000000000000000000000000000000000000" ] \
             || ! CHANGED=$(git diff --name-only "$BASE" "$HEAD_SHA" 2>/dev/null); then
            DIFF_OK=false
            CHANGED=""
          fi

          if [ "$DIFF_OK" = false ]; then
            # Fail safe: if the diff cannot be computed, run everything.
            REQUIRES_EVAL=true
            TOUCHES_POLICY=true
          else
            REQUIRES_EVAL=false
            TOUCHES_POLICY=false
            if grep -qE "$REQUIRES_EVAL_RE" <<< "$CHANGED"; then REQUIRES_EVAL=true; fi
            if grep -qE "$TOUCHES_POLICY_RE" <<< "$CHANGED"; then TOUCHES_POLICY=true; fi
          fi

          CHANGED_ONELINE=$(tr '\n' ' ' <<< "$CHANGED" | sed 's/[[:space:]]*$//')
          {
            echo "changed-files=$CHANGED_ONELINE"
            echo "requires-eval=$REQUIRES_EVAL"
            echo "touches-policy=$TOUCHES_POLICY"
          } >> "$GITHUB_OUTPUT"

          mkdir -p ci-artifacts
          CHANGED_ONELINE="$CHANGED_ONELINE" DIFF_OK="$DIFF_OK" BASE="$BASE" \
          REQUIRES_EVAL="$REQUIRES_EVAL" TOUCHES_POLICY="$TOUCHES_POLICY" \
          python3 - <<'PY'
          import json, os
          from datetime import datetime, timezone
          report = {
              "job": "change-type-check",
              "status": "passed",
              "timestamp": datetime.now(timezone.utc).isoformat(),
              "base": os.environ["BASE"],
              "head": os.environ["HEAD_SHA"],
              "diff_computed": os.environ["DIFF_OK"] == "true",
              "changed_files": os.environ["CHANGED_ONELINE"].split(),
              "requires_eval": os.environ["REQUIRES_EVAL"] == "true",
              "touches_policy": os.environ["TOUCHES_POLICY"] == "true",
          }
          with open("ci-artifacts/change-classification.json", "w") as f:
              json.dump(report, f, indent=2)
          PY
          echo "requires-eval=$REQUIRES_EVAL touches-policy=$TOUCHES_POLICY (diff computed: $DIFF_OK)"

      - name: Upload change classification
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: change-classification
          path: ci-artifacts/change-classification.json
          retention-days: 90
          if-no-files-found: ignore

  # gating, permanent: runs on every change; never continue-on-error, never path-filtered
  policy-gate:
    name: Policy Test Suite
    runs-on: ubuntu-latest
    needs: change-type-check
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build gimpl image
        uses: docker/build-push-action@v6
        env:
          DOCKER_BUILD_SUMMARY: false
          DOCKER_BUILD_RECORD_UPLOAD: false
        with:
          context: .
          tags: gimpl:ci
          load: true
          cache-from: type=gha,scope=gimpl-image
          cache-to: type=gha,scope=gimpl-image,mode=max

      - name: Run policy tests
        timeout-minutes: 5
        run: |
          mkdir -p ci-artifacts
          docker run --rm --network none \
            -v "$GITHUB_WORKSPACE":/workspace:ro \
            -v "$GITHUB_WORKSPACE/ci-artifacts":/reports \
            -w /workspace \
            -e PYTHONDONTWRITEBYTECODE=1 \
            gimpl:ci \
            python3 -m pytest eval/test_policy.py -v -p no:cacheprovider \
              --json-report --json-report-file=/reports/policy-report.json

      - name: Upload policy report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: policy-report
          path: ci-artifacts/policy-report.json
          retention-days: 90
          if-no-files-found: ignore

  # gating, conditional: runs the harness when change-type-check sets requires-eval
  eval-gate:
    name: Evaluation Harness
    runs-on: ubuntu-latest
    needs: [change-type-check, policy-gate]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Record not-triggered state
        if: needs.change-type-check.outputs.requires-eval != 'true'
        run: python3 scripts/run-eval-gate.py --reports ci-artifacts --not-triggered

      - uses: docker/setup-buildx-action@v3
        if: needs.change-type-check.outputs.requires-eval == 'true'

      - name: Build gimpl image
        if: needs.change-type-check.outputs.requires-eval == 'true'
        uses: docker/build-push-action@v6
        env:
          DOCKER_BUILD_SUMMARY: false
          DOCKER_BUILD_RECORD_UPLOAD: false
        with:
          context: .
          tags: gimpl:ci
          load: true
          cache-from: type=gha,scope=gimpl-image

      - name: Run evaluation harness
        if: needs.change-type-check.outputs.requires-eval == 'true'
        timeout-minutes: 5
        run: |
          mkdir -p ci-artifacts
          docker run --rm --network none \
            -v "$GITHUB_WORKSPACE":/workspace:ro \
            -v "$GITHUB_WORKSPACE/ci-artifacts":/reports \
            -w /workspace \
            -e PYTHONDONTWRITEBYTECODE=1 \
            gimpl:ci \
            python3 scripts/run-eval-gate.py --reports /reports

      - name: Upload eval reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eval-report
          path: |
            ci-artifacts/eval-report.json
            ci-artifacts/eval-tests-report.json
          retention-days: 90
          if-no-files-found: ignore

  # advisory: never a required check; the reviewer always exits 0 and the job cannot fail the run
  agent-review:
    name: Advisory Code Review
    runs-on: ubuntu-latest
    needs: [change-type-check, policy-gate]
    if: github.event_name == 'pull_request'
    continue-on-error: true
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build gimpl image
        uses: docker/build-push-action@v6
        env:
          DOCKER_BUILD_SUMMARY: false
          DOCKER_BUILD_RECORD_UPLOAD: false
        with:
          context: .
          tags: gimpl:ci
          load: true
          cache-from: type=gha,scope=gimpl-image

      # The only step in the workflow that receives a secret.
      - name: Run advisory reviewer
        timeout-minutes: 5
        env:
          CI_REVIEWER_OPENROUTER_KEY: ${{ secrets.CI_REVIEWER_OPENROUTER_KEY }}
          CI_REVIEWER_MODEL: ${{ vars.CI_REVIEWER_MODEL }}
          CHANGED_FILES: ${{ needs.change-type-check.outputs.changed-files }}
        run: |
          mkdir -p ci-artifacts
          docker run --rm \
            -v "$GITHUB_WORKSPACE":/workspace:ro \
            -v "$GITHUB_WORKSPACE/ci-artifacts":/out \
            -w /workspace \
            -e PYTHONDONTWRITEBYTECODE=1 \
            -e CI_REVIEWER_OPENROUTER_KEY \
            -e CI_REVIEWER_MODEL \
            -e CHANGED_FILES \
            gimpl:ci \
            python3 scripts/run-reviewer.py

      - name: Post review comment
        if: always() && hashFiles('ci-artifacts/review-audit.json') != ''
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          if jq -e '.status == "reviewed"' ci-artifacts/review-audit.json > /dev/null; then
            gh pr comment "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --body-file ci-artifacts/review-output.md
          else
            cat ci-artifacts/review-output.md >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload advisory review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: agent-review
          path: |
            ci-artifacts/review-output.md
            ci-artifacts/review-audit.json
          retention-days: 90
          if-no-files-found: ignore

  # gating, permanent: checks this file's own guardrails; no needs:, so it runs whatever the other jobs do
  pipeline-integrity:
    name: Pipeline Integrity Check
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # The checker parses ci.yml with PyYAML, at the version pinned in requirements-ci.txt.
      - name: Install PyYAML
        run: python3 -m pip install --disable-pip-version-check --no-cache-dir PyYAML==6.0.4

      # One step per guardrail, so a failure names the guardrail it came from.
      # success() || failure(): every check still runs after an earlier one fails.
      - name: "Check 1: gates have no continue-on-error"
        id: check-gates
        run: python3 scripts/check-pipeline-integrity.py --check gates --annotate

      - name: "Check 2: audit-trail keeps if: always()"
        id: check-audit
        if: success() || failure()
        run: python3 scripts/check-pipeline-integrity.py --check audit --annotate

      - name: "Check 3: change-type-check classifier exists"
        id: check-classifier
        if: success() || failure()
        run: python3 scripts/check-pipeline-integrity.py --check classifier --annotate

      - name: "Check 4: pipeline-integrity stays independent"
        id: check-self
        if: success() || failure()
        run: python3 scripts/check-pipeline-integrity.py --check self --annotate

      - name: Write pipeline integrity report
        if: always()
        env:
          OUTCOME_GATES: ${{ steps.check-gates.outcome }}
          OUTCOME_AUDIT: ${{ steps.check-audit.outcome }}
          OUTCOME_CLASSIFIER: ${{ steps.check-classifier.outcome }}
          OUTCOME_SELF: ${{ steps.check-self.outcome }}
        run: |
          python3 scripts/check-pipeline-integrity.py \
            --report ci-artifacts/pipeline-integrity-report.json \
            --step-outcome "gates=$OUTCOME_GATES" \
            --step-outcome "audit=$OUTCOME_AUDIT" \
            --step-outcome "classifier=$OUTCOME_CLASSIFIER" \
            --step-outcome "self=$OUTCOME_SELF"

      - name: Upload pipeline integrity report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pipeline-integrity-report
          path: ci-artifacts/pipeline-integrity-report.json
          retention-days: 90
          if-no-files-found: ignore

  # informational: always runs and records every job's state, including failures and skips
  audit-trail:
    name: Audit Trail
    runs-on: ubuntu-latest
    needs: [change-type-check, policy-gate, eval-gate, agent-review, pipeline-integrity]
    if: always()
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: ci-artifacts
          merge-multiple: true

      - name: Build audit trail
        env:
          SHA: ${{ github.sha }}
          EVENT_NAME: ${{ github.event_name }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          CHANGED_FILES: ${{ needs.change-type-check.outputs.changed-files }}
          REQUIRES_EVAL: ${{ needs.change-type-check.outputs.requires-eval }}
          TOUCHES_POLICY: ${{ needs.change-type-check.outputs.touches-policy }}
          RESULT_CLASSIFIER: ${{ needs.change-type-check.result }}
          RESULT_POLICY: ${{ needs.policy-gate.result }}
          RESULT_EVAL: ${{ needs.eval-gate.result }}
          RESULT_REVIEW: ${{ needs.agent-review.result }}
          RESULT_INTEGRITY: ${{ needs.pipeline-integrity.result }}
        run: |
          python3 scripts/build-audit-trail.py \
            --artifacts ci-artifacts \
            --sha "$SHA" \
            --event "$EVENT_NAME" \
            --pr "${PR_NUMBER:-}" \
            --run-id "$GITHUB_RUN_ID" \
            --run-url "$RUN_URL" \
            --changed-files "$CHANGED_FILES" \
            --requires-eval "$REQUIRES_EVAL" \
            --touches-policy "$TOUCHES_POLICY" \
            --result "change-type-check=$RESULT_CLASSIFIER" \
            --result "policy-gate=$RESULT_POLICY" \
            --result "eval-gate=$RESULT_EVAL" \
            --result "agent-review=$RESULT_REVIEW" \
            --result "pipeline-integrity=$RESULT_INTEGRITY"
          cat ci-audit-trail-summary.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload audit trail
        uses: actions/upload-artifact@v4
        with:
          name: audit-trail
          path: |
            ci-audit-trail-*.json
            ci-audit-trail-summary.md
          retention-days: 90
          if-no-files-found: error

      - name: Post audit summary comment
        if: github.event_name == 'pull_request'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: gh pr comment "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --body-file ci-audit-trail-summary.md
